services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-local

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: "neo4j/huanhoang"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.refactor.mergeNodes"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins

    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
